<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PulmoFast App - NPOC NAAT Diagnostic</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React & ReactDOM CDN -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <!-- Babel CDN for JSX -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
    }
  </style>
</head>
<body class="bg-[#F4FBF7] text-slate-800 antialiased">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    // Helper Component for Lucide Icons in Standalone HTML React
    const Icon = ({ name, className = "w-4 h-4", ...props }) => {
      useEffect(() => {
        if (window.lucide) {
          window.lucide.createIcons();
        }
      });
      return <i data-lucide={name} className={className} {...props}></i>;
    };

    function App() {
      // Navigation State
      const [activeTab, setActiveTab] = useState('dashboard');
      
      // Bluetooth & Kit Simulation States
      const [isConnecting, setIsConnecting] = useState(false);
      const [isConnected, setIsConnected] = useState(false);
      const [testingProgress, setTestingProgress] = useState(0);
      const [isTesting, setIsTesting] = useState(false);
      const [testStage, setTestStage] = useState('');
      
      // Patient & Diagnostic Data State
      const [diagnosticResult, setDiagnosticResult] = useState({
        status: 'POSITIVE', // 'POSITIVE', 'NEGATIVE'
        date: '24 Oktober 2026',
        time: '09:30 WIB',
        sampleId: 'PF-2026-8842',
        kitId: 'PULMO-KIT-v2-098',
        patientName: 'Budi Santoso',
        patientAge: 34,
        patientGender: 'Laki-laki',
        confidenceRate: '99.2%'
      });

      // PMO Tracker State
      const [pmoDays, setPmoDays] = useState(42);
      const [pmoStreak, setPmoStreak] = useState(14);
      const [todayTaken, setTodayTaken] = useState(false);

      // Chat Consultation State
      const [messages, setMessages] = useState([
        { sender: 'doctor', text: 'Halo Budi, selamat pagi! Saya dr. Sp.P. Hasil pemeriksaan PulmoFast Kit Anda sudah terhubung ke sistem kami. Ada yang ingin dikonsultasikan?', time: '09:35' }
      ]);
      const [inputMsg, setInputMsg] = useState('');

      useEffect(() => {
        if (window.lucide) {
          window.lucide.createIcons();
        }
      }, [activeTab, isConnected, isTesting, messages]);

      // Start Bluetooth Pairing Simulation
      const handleConnectDevice = () => {
        setIsConnecting(true);
        setTimeout(() => {
          setIsConnecting(false);
          setIsConnected(true);
        }, 2000);
      };

      // Run Test Process Simulation
      const startSampleAnalysis = () => {
        if (!isConnected) return;
        setIsTesting(true);
        setTestingProgress(0);
        setTestStage('Ekstraksi Sampel Dahak/Lidah...');

        const interval = setInterval(() => {
          setTestingProgress((prev) => {
            if (prev >= 100) {
              clearInterval(interval);
              setIsTesting(false);
              setTestStage('Analisis Selesai!');
              setDiagnosticResult(prev => ({
                ...prev,
                status: Math.random() > 0.4 ? 'POSITIVE' : 'NEGATIVE',
                date: 'Hari Ini',
                time: 'Baru saja'
              }));
              return 100;
            }
            
            if (prev === 25) setTestStage('Proses Amplifikasi NPOC-NAAT...');
            if (prev === 65) setTestStage('Deteksi Sinyal Flouresensi Molekuler...');
            if (prev === 90) setTestStage('Mengonfirmasi Hasil Diagnostik...');
            
            return prev + 5;
          });
        }, 250);
      };

      // Send Message in Teleconsultation
      const handleSendMessage = () => {
        if (!inputMsg.trim()) return;
        const newMsg = { sender: 'user', text: inputMsg, time: new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}) };
        setMessages([...messages, newMsg]);
        setInputMsg('');

        // Simulated Auto Doctor Response
        setTimeout(() => {
          setMessages(prev => [
            ...prev,
            {
              sender: 'doctor',
              text: 'Terima kasih informasinya. Berdasarkan hasil positif dari PulmoFast Kit, Anda disarankan untuk segera memulai Fase Intensif Obat Anti Tuberkulosis (OAT). Saya akan buatkan rujukan ke Puskesmas terdekat.',
              time: new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})
            }
          ]);
        }, 1500);
      };

      return (
        <div className="min-h-screen bg-[#F4FBF7] text-slate-800 font-sans flex flex-col md:flex-row">
          
          {/* SIDEBAR NAVIGATION (Desktop & Tablet) */}
          <aside className="w-full md:w-64 bg-[#1A5D3A] text-white flex-shrink-0 flex flex-col justify-between shadow-xl">
            <div>
              {/* Logo & Header */}
              <div className="p-5 border-b border-emerald-700/50 flex items-center gap-3">
                <div className="w-10 h-10 rounded-xl bg-gradient-to-tr from-emerald-400 to-green-300 flex items-center justify-center text-[#1A5D3A] shadow-md font-bold">
                  <Icon name="activity" className="w-6 h-6 stroke-[2.5]" />
                </div>
                <div>
                  <h1 className="font-extrabold text-xl tracking-tight text-white flex items-center gap-1">
                    PULMO<span className="text-emerald-300">FAST</span>
                  </h1>
                  <p className="text-[10px] text-emerald-200 tracking-wider uppercase font-semibold">NPOC NAAT Diagnostic</p>
                </div>
              </div>

              {/* Device Connection Status Widget */}
              <div className="m-4 p-3 rounded-xl bg-emerald-900/40 border border-emerald-600/40 text-xs">
                <div className="flex items-center justify-between mb-2">
                  <span className="text-emerald-200 font-medium flex items-center gap-1.5">
                    <Icon name="bluetooth" className={`w-3.5 h-3.5 ${isConnected ? 'text-emerald-400 animate-pulse' : 'text-slate-400'}`} />
                    PulmoFast Kit
                  </span>
                  <span className={`px-2 py-0.5 rounded-full text-[10px] font-bold ${isConnected ? 'bg-emerald-500/20 text-emerald-300 border border-emerald-500/30' : 'bg-amber-500/20 text-amber-300'}`}>
                    {isConnected ? 'Terhubung' : 'Terputus'}
                  </span>
                </div>
                {!isConnected ? (
                  <button 
                    onClick={handleConnectDevice} 
                    disabled={isConnecting}
                    className="w-full py-1.5 px-3 bg-emerald-500 hover:bg-emerald-400 text-[#1A5D3A] font-bold rounded-lg transition-all flex items-center justify-center gap-1.5 shadow-sm active:scale-95 text-xs"
                  >
                    <Icon name={isConnecting ? "refresh-cw" : "bluetooth"} className={`w-3.5 h-3.5 ${isConnecting ? 'animate-spin' : ''}`} />
                    {isConnecting ? 'Menghubungkan...' : 'Sambungkan Kit'}
                  </button>
                ) : (
                  <p className="text-[11px] text-emerald-300/80">Sinyal Bluetooth Stabil (100%)</p>
                )}
              </div>

              {/* Nav Items */}
              <nav className="px-3 space-y-1">
                {[
                  { id: 'dashboard', label: 'Dashboard Utama', icon: 'activity' },
                  { id: 'diagnostic', label: 'Hasil Diagnostik', icon: 'file-text', badge: diagnosticResult.status === 'POSITIVE' ? 'Positif' : null },
                  { id: 'consultation', label: 'Konsultasi Dokter', icon: 'message-square', badge: 'Gratis' },
                  { id: 'therapy', label: 'Panduan Terapi & Edukasi', icon: 'pill' },
                  { id: 'pmo', label: 'Pengawas Obat (PMO)', icon: 'heart-pulse' },
                  { id: 'tracing', label: 'Pelacakan Kontak Erat', icon: 'shield-alert' },
                  { id: 'facilities', label: 'Faskes & Puskesmas', icon: 'map-pin' },
                ].map((item) => {
                  const isActive = activeTab === item.id;
                  return (
                    <button
                      key={item.id}
                      onClick={() => setActiveTab(item.id)}
                      className={`w-full flex items-center justify-between px-3 py-2.5 rounded-xl text-xs font-semibold transition-all ${
                        isActive 
                          ? 'bg-emerald-500 text-[#1A5D3A] shadow-md font-bold' 
                          : 'text-emerald-100 hover:bg-emerald-800/50 hover:text-white'
                      }`}
                    >
                      <div className="flex items-center gap-2.5">
                        <Icon name={item.icon} className={`w-4 h-4 ${isActive ? 'text-[#1A5D3A]' : 'text-emerald-300'}`} />
                        <span>{item.label}</span>
                      </div>
                      {item.badge && (
                        <span className={`px-1.5 py-0.5 rounded text-[9px] font-bold ${
                          item.badge === 'Positif' ? 'bg-red-500 text-white' : 'bg-emerald-700 text-emerald-100'
                        }`}>
                          {item.badge}
                        </span>
                      )}
                    </button>
                  );
                })}
              </nav>
            </div>

            {/* User Info Footer */}
            <div className="p-4 border-t border-emerald-700/50 flex items-center gap-3">
              <div className="w-8 h-8 rounded-full bg-emerald-700 flex items-center justify-center font-bold text-emerald-200">
                BS
              </div>
              <div className="overflow-hidden">
                <p className="text-xs font-bold text-white truncate">{diagnosticResult.patientName}</p>
                <p className="text-[10px] text-emerald-300 truncate">Pasien Terdaftar</p>
              </div>
            </div>
          </aside>

          {/* MAIN CONTENT AREA */}
          <main className="flex-1 flex flex-col min-w-0 overflow-y-auto">
            
            {/* Top Header Banner */}
            <header className="bg-white border-b border-slate-200 px-6 py-4 flex flex-col sm:flex-row sm:items-center justify-between gap-4 sticky top-0 z-10 shadow-sm">
              <div>
                <h2 className="text-lg font-bold text-slate-800 capitalize">
                  {activeTab === 'dashboard' && 'Dashboard Diagnostic Real-time'}
                  {activeTab === 'diagnostic' && 'Hasil Diagnostik Tuberkulosis'}
                  {activeTab === 'consultation' && 'Konsultasi Dokter Spesialis Paru (Gratis)'}
                  {activeTab === 'therapy' && 'Panduan Terapi Farmakologis & Non-Farmakologis'}
                  {activeTab === 'pmo' && 'Pengawas Menelan Obat (PMO Digital)'}
                  {activeTab === 'tracing' && 'Pelacakan & Pemeriksaan Kontak Erat'}
                  {activeTab === 'facilities' && 'Lokasi Faskes & Stok Obat OAT Gratis'}
                </h2>
                <p className="text-xs text-slate-500">
                  "Hentikan TB, Mulai dari Deteksi Dini Bersama PulmoFast Kit"
                </p>
              </div>
              <div className="flex items-center gap-2">
                <span className="inline-flex items-center gap-1 px-3 py-1 bg-emerald-50 text-emerald-700 border border-emerald-200 rounded-full text-xs font-medium">
                  <span className="w-2 h-2 rounded-full bg-emerald-500 animate-ping"></span>
                  Sistem Aktif
                </span>
              </div>
            </header>

            {/* Dynamic Tab Body */}
            <div className="p-4 md:p-6 space-y-6 max-w-6xl w-full mx-auto">
              
              {/* TAB 1: DASHBOARD UTAMA */}
              {activeTab === 'dashboard' && (
                <div className="space-y-6">
                  
                  {/* Quick Hero Scanner Section */}
                  <div className="bg-gradient-to-br from-[#1A5D3A] to-emerald-900 rounded-2xl p-6 text-white shadow-lg relative overflow-hidden">
                    <div className="absolute top-0 right-0 w-64 h-64 bg-emerald-500/10 rounded-full blur-3xl pointer-events-none"></div>
                    <div className="relative z-10 grid grid-cols-1 md:grid-cols-3 gap-6 items-center">
                      <div className="md:col-span-2 space-y-3">
                        <span className="px-2.5 py-1 bg-emerald-400/20 text-emerald-300 rounded-lg text-xs font-semibold border border-emerald-400/30">
                          Teknologi NPOC - NAAT
                        </span>
                        <h3 className="text-2xl font-bold leading-tight">
                          Uji Sampel Diagnostik TB Cepat & Presisi dalam 30-45 Menit
                        </h3>
                        <p className="text-emerald-100 text-xs leading-relaxed">
                          Masukkan sampel dahak atau usap lidah ke dalam <strong>PulmoFast Kit</strong>. Sambungkan via Bluetooth untuk memantau ekstraksi DNA dan amplifikasi molekuler secara <em>real-time</em>.
                        </p>
                        
                        {/* Device Interactive Controls */}
                        <div className="pt-2 flex flex-wrap gap-3">
                          {!isConnected ? (
                            <button 
                              onClick={handleConnectDevice} 
                              disabled={isConnecting}
                              className="px-4 py-2.5 bg-emerald-400 hover:bg-emerald-300 text-[#1A5D3A] font-bold rounded-xl text-xs flex items-center gap-2 shadow-md transition-all active:scale-95"
                            >
                              <Icon name="bluetooth" className="w-4 h-4" />
                              {isConnecting ? 'Menghubungkan...' : 'Hubungkan PulmoFast Kit'}
                            </button>
                          ) : (
                            <button 
                              onClick={startSampleAnalysis} 
                              disabled={isTesting}
                              className="px-4 py-2.5 bg-emerald-400 hover:bg-emerald-300 text-[#1A5D3A] font-bold rounded-xl text-xs flex items-center gap-2 shadow-md transition-all active:scale-95"
                            >
                              <Icon name="activity" className={`w-4 h-4 ${isTesting ? 'animate-spin' : ''}`} />
                              {isTesting ? 'Menganalisis Sampel...' : 'Mulai Analisis Sampel Baru'}
                            </button>
                          )}
                          
                          <button 
                            onClick={() => setActiveTab('diagnostic')}
                            className="px-4 py-2.5 bg-white/10 hover:bg-white/20 text-white font-semibold rounded-xl text-xs flex items-center gap-2 border border-white/20 transition-all"
                          >
                            Lihat Hasil Terakhir
                          </button>
                        </div>
                      </div>

                      {/* Device Graphic / Status Box */}
                      <div className="bg-emerald-950/60 backdrop-blur border border-emerald-500/30 rounded-xl p-4 flex flex-col items-center justify-center text-center space-y-3">
                        <div className="w-16 h-16 rounded-2xl bg-gradient-to-tr from-emerald-500 to-green-300 flex items-center justify-center text-[#1A5D3A] shadow-inner">
                          <Icon name="heart-pulse" className={`w-8 h-8 ${isTesting ? 'animate-bounce' : ''}`} />
                        </div>
                        <div>
                          <p className="text-xs font-semibold text-emerald-300">Status Alat PulmoFast</p>
                          <p className="text-sm font-bold text-white">
                            {isTesting ? testStage : isConnected ? 'Siap Menerima Sampel' : 'Belum Terhubung'}
                          </p>
                        </div>

                        {/* Progress Bar for Testing */}
                        {isTesting && (
                          <div className="w-full space-y-1">
                            <div className="w-full bg-emerald-900 rounded-full h-2 overflow-hidden">
                              <div 
                                className="bg-emerald-400 h-2 rounded-full transition-all duration-300"
                                style={{ width: `${testingProgress}%` }}
                              ></div>
                            </div>
                            <span className="text-[10px] text-emerald-300 font-mono">{testingProgress}% Selesai</span>
                          </div>
                        )}
                      </div>
                    </div>
                  </div>

                  {/* Status Banner Result Summary */}
                  <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                    {/* Result Card */}
                    <div className={`p-5 rounded-2xl border ${
                      diagnosticResult.status === 'POSITIVE' 
                        ? 'bg-red-50 border-red-200 text-red-900' 
                        : 'bg-emerald-50 border-emerald-200 text-emerald-900'
                    } flex items-start gap-4 shadow-sm`}>
                      <div className={`p-3 rounded-xl ${
                        diagnosticResult.status === 'POSITIVE' ? 'bg-red-500 text-white' : 'bg-emerald-600 text-white'
                      }`}>
                        <Icon name={diagnosticResult.status === 'POSITIVE' ? 'alert-triangle' : 'check-circle-2'} className="w-6 h-6" />
                      </div>
                      <div>
                        <span className="text-[11px] uppercase tracking-wider font-bold opacity-75">Status Hasil Terakhir</span>
                        <h4 className="text-xl font-extrabold mt-0.5">
                          {diagnosticResult.status === 'POSITIVE' ? 'POSITIF TB' : 'NEGATIF TB'}
                        </h4>
                        <p className="text-xs mt-1 opacity-80">
                          Diperiksa pada {diagnosticResult.date} ({diagnosticResult.time})
                        </p>
                      </div>
                    </div>

                    {/* Consultation Quick Card */}
                    <div className="p-5 rounded-2xl bg-white border border-slate-200 shadow-sm flex items-start gap-4">
                      <div className="p-3 rounded-xl bg-emerald-100 text-[#1A5D3A]">
                        <Icon name="message-square" className="w-6 h-6" />
                      </div>
                      <div>
                        <span className="text-[11px] text-slate-500 uppercase tracking-wider font-bold">Layanan Dokter</span>
                        <h4 className="text-base font-bold text-slate-800">Konsultasi Gratis</h4>
                        <p className="text-xs text-slate-500 mt-0.5">Dokter spesialis paru siap merespon hasil tes Anda.</p>
                        <button 
                          onClick={() => setActiveTab('consultation')}
                          className="text-xs font-bold text-[#1A5D3A] hover:underline mt-2 inline-flex items-center gap-1"
                        >
                          Mulai Chat Sekarang <Icon name="chevron-right" className="w-3.5 h-3.5" />
                        </button>
                      </div>
                    </div>

                    {/* PMO Streak Card */}
                    <div className="p-5 rounded-2xl bg-white border border-slate-200 shadow-sm flex items-start gap-4">
                      <div className="p-3 rounded-xl bg-amber-100 text-amber-700">
                        <Icon name="award" className="w-6 h-6" />
                      </div>
                      <div>
                        <span className="text-[11px] text-slate-500 uppercase tracking-wider font-bold">Kepatuhan Obat</span>
                        <h4 className="text-base font-bold text-slate-800">{pmoStreak} Hari Berturut-turut</h4>
                        <p className="text-xs text-slate-500 mt-0.5">Program OAT berjalan 42 dari 180 hari.</p>
                        <button 
                          onClick={() => setActiveTab('pmo')}
                          className="text-xs font-bold text-[#1A5D3A] hover:underline mt-2 inline-flex items-center gap-1"
                        >
                          Buka PMO Tracker <Icon name="chevron-right" className="w-3.5 h-3.5" />
                        </button>
                      </div>
                    </div>
                  </div>

                  {/* Key Features Quick Grid from Poster */}
                  <div>
                    <h3 className="text-sm font-bold text-slate-700 uppercase tracking-wider mb-3">Keunggulan Utama PulmoFast Kit</h3>
                    <div className="grid grid-cols-2 sm:grid-cols-4 gap-3">
                      {[
                        { title: 'Cepat', desc: 'Hasil Akurat 30-45 Menit', color: 'bg-emerald-500' },
                        { title: 'Akurat', desc: 'Akurasi Tinggi Molekuler NAAT', color: 'bg-green-500' },
                        { title: 'Mudah Digunakan', desc: 'Prosedur Sederhana Awam/Nakes', color: 'bg-emerald-600' },
                        { title: 'Portable', desc: 'Ringkas & Mudah Dibawa Kebatu', color: 'bg-teal-600' }
                      ].map((feat, idx) => (
                        <div key={idx} className="bg-white p-4 rounded-xl border border-slate-200 shadow-sm text-center">
                          <div className={`w-3 h-3 ${feat.color} rounded-full mx-auto mb-2`}></div>
                          <h4 className="font-bold text-slate-800 text-sm">{feat.title}</h4>
                          <p className="text-[11px] text-slate-500 mt-1">{feat.desc}</p>
                        </div>
                      ))}
                    </div>
                  </div>

                </div>
              )}

              {/* TAB 2: HASIL DIAGNOSTIK */}
              {activeTab === 'diagnostic' && (
                <div className="space-y-6">
                  
                  {/* Main Diagnostic Result Sheet */}
                  <div className="bg-white rounded-2xl border border-slate-200 shadow-sm overflow-hidden">
                    <div className="bg-[#1A5D3A] text-white p-6 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">
                      <div>
                        <span className="text-xs text-emerald-200 uppercase tracking-wider font-semibold">Laporan Hasil Diagnostik Resmi</span>
                        <h3 className="text-xl font-bold mt-1">Pemeriksaan Molekuler NPOC-NAAT TB</h3>
                      </div>
                      <button 
                        onClick={() => window.print()}
                        className="px-3.5 py-2 bg-emerald-500 hover:bg-emerald-400 text-[#1A5D3A] font-bold rounded-xl text-xs flex items-center gap-1.5 shadow"
                      >
                        <Icon name="download" className="w-4 h-4" /> Cetak / Simpan PDF
                      </button>
                    </div>

                    <div className="p-6 space-y-6">
                      {/* Status Banner */}
                      <div className={`p-6 rounded-2xl border flex flex-col sm:flex-row items-center justify-between gap-4 ${
                        diagnosticResult.status === 'POSITIVE'
                          ? 'bg-red-50 border-red-200 text-red-900'
                          : 'bg-emerald-50 border-emerald-200 text-emerald-900'
                      }`}>
                        <div className="flex items-center gap-4 text-center sm:text-left">
                          <div className={`p-4 rounded-2xl ${diagnosticResult.status === 'POSITIVE' ? 'bg-red-600 text-white' : 'bg-emerald-600 text-white'}`}>
                            <Icon name={diagnosticResult.status === 'POSITIVE' ? 'alert-triangle' : 'check-circle-2'} className="w-8 h-8" />
                          </div>
                          <div>
                            <span className="text-xs uppercase font-extrabold tracking-wider opacity-75">Hasil Diagnosis Diagnostik Kit</span>
                            <h2 className="text-3xl font-black">{diagnosticResult.status === 'POSITIVE' ? 'POSITIF TUBERKULOSIS' : 'NEGATIF TUBERKULOSIS'}</h2>
                            <p className="text-xs mt-1 opacity-90">SENSITIVITAS MOLEKULER tinggi berbasis DNA Mycobacterium tuberculosis.</p>
                          </div>
                        </div>
                        <div className="text-right sm:border-l sm:border-slate-300 sm:pl-6">
                          <p className="text-xs text-slate-500">Tingkat Kepercayaan</p>
                          <p className="text-lg font-bold text-slate-800">{diagnosticResult.confidenceRate}</p>
                        </div>
                      </div>

                      {/* Patient & Kit Meta Details Grid */}
                      <div className="grid grid-cols-2 md:grid-cols-4 gap-4 bg-slate-50 p-4 rounded-xl text-xs border border-slate-200">
                        <div>
                          <span className="text-slate-400 block font-medium">Nama Pasien</span>
                          <strong className="text-slate-800 text-sm">{diagnosticResult.patientName}</strong>
                        </div>
                        <div>
                          <span className="text-slate-400 block font-medium">ID Sampel</span>
                          <strong className="text-slate-800 text-sm">{diagnosticResult.sampleId}</strong>
                        </div>
                        <div>
                          <span className="text-slate-400 block font-medium">Perangkat Kit</span>
                          <strong className="text-slate-800 text-sm">{diagnosticResult.kitId}</strong>
                        </div>
                        <div>
                          <span className="text-slate-400 block font-medium">Waktu Pemeriksaan</span>
                          <strong className="text-slate-800 text-sm">{diagnosticResult.date} ({diagnosticResult.time})</strong>
                        </div>
                      </div>

                      {/* Clinical Next Steps */}
                      <div className="border-t border-slate-200 pt-5 space-y-3">
                        <h4 className="font-bold text-slate-800 text-sm flex items-center gap-2">
                          <Icon name="activity" className="w-4 h-4 text-[#1A5D3A]" /> Langkah Tindak Lanjut Medis:
                        </h4>
                        {diagnosticResult.status === 'POSITIVE' ? (
                          <ul className="space-y-2 text-xs text-slate-600 list-disc list-inside bg-amber-50 p-4 rounded-xl border border-amber-200">
